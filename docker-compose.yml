# Neo4j 5.11+ includes vector indexes. This compose file is the local demo database.
# Aura Free works too: skip this file and put the Aura URI and password in .env.

services:
  neo4j:
    image: neo4j:5.26.0
    container_name: mini-astr-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/mini-astr-demo
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  neo4j_data:
